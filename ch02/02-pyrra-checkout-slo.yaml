apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: orderflow-checkout-avail
  namespace: orderflow-prod
  labels:
    prometheus: k8s
    role: alert-rules
    team: sre-platform
spec:
  description: >-
    OrderFlow checkout 30-day rolling availability SLO (99.95%).
  target: "99.95"
  window: 30d
  indicator:
    ratio:
      errors:
        metric: >-
          http_requests_total{namespace="orderflow-prod",code=~"5.."}
      total:
        metric: >-
          http_requests_total{namespace="orderflow-prod"}
