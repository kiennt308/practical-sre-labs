# 01-orderflow-service.yaml
# OrderFlow Checkout OpenSLO v1 Service and DataSource definitions.
# Copyright (c) 2026 Kien Nguyen. Licensed under Apache-2.0.
apiVersion: openslo/v1
kind: Service
metadata:
  name: orderflow-checkout
  displayName: OrderFlow Checkout Service
  labels:
    namespace: orderflow-prod
    domain: checkout
spec:
  description: >-
    Core checkout API path spanning order-gateway, order-service,
    and payment-worker across us-east-1 and eu-west-1.
---
apiVersion: openslo/v1
kind: DataSource
metadata:
  name: orderflow-prom
  displayName: OrderFlow Prometheus v3.16
  labels:
    namespace: orderflow-prod
spec:
  description: Primary Prometheus v3.16 metric store for OrderFlow.
  type: Prometheus
  connectionDetails:
    url: http://prometheus-operated.monitoring.svc:9090
